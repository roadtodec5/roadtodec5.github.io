#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.card{background:linear-gradient(var(--wine1),var(--wine2));border:2px solid var(--gold);border-radius:18px;box-shadow:0 8px 26px rgba(60,6,12,.45)}
.display{font-family:"Marcellus",Georgia,serif;font-weight:400}
.gold{color:var(--gold2)}
[hidden]{display:none!important}
button{font-family:inherit}
.btn{font:700 16px "Figtree",sans-serif;border-radius:12px;border:1px solid var(--gold);background:rgba(0,0,0,.2);color:var(--cream);padding:11px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:linear-gradient(#ffe08a,#e0a93c);color:var(--ink);border-color:#fff3c4}
.btn:active{transform:translateY(1px)}
#signup{font:800 20px/1.15 "Figtree",sans-serif;padding:15px 12px;border-radius:14px;border:2px solid #fff3c4;background:linear-gradient(#ffe9a0,#f2c04a);color:var(--ink);animation:glow 2.6s ease-in-out infinite}

@keyframes callout{0%{box-shadow:0 0 0 0 rgba(255,224,138,.7)}100%{box-shadow:0 0 0 14px rgba(255,224,138,0)}}
@media (prefers-reduced-motion:reduce){#signup{animation:none}}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.link{background:none;border:0;color:var(--gold2);font:600 14px "Figtree",sans-serif;text-decoration:underline;cursor:pointer;padding:4px}
/* HUD */
#hud{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
#hud .k{font-size:11px;letter-spacing:.18em;font-weight:700;display:block;margin-bottom:1px}
@media (max-width:560px){#hud .k{display:none}}
#right{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center}
#clock{padding:8px 14px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;min-width:7.2ch;text-align:center}
#mute{width:44px;height:44px;border-radius:50%;padding:0;font-size:19px}
#tip{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);width:min(520px,88vw);padding:11px 16px;text-align:center;font-weight:700;font-size:17px;line-height:1.3;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#tip.on{opacity:1;transform:translate(-50%,0)}
#tip .n{display:block;font-size:12px;letter-spacing:.16em;color:var(--gold2);margin-bottom:3px}
#joy{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.65);display:none;touch-action:none}
#knob{position:absolute;left:43px;top:43px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media (pointer:coarse){#joy.show{display:block}}
/* overlays */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,6,10,.38);backdrop-filter:blur(2px);overflow:auto;padding:12px 0}
.ov>.card{width:min(460px,90vw);padding:20px 20px 18px;text-align:center;display:grid;gap:12px;box-sizing:border-box}
.kick{letter-spacing:.2em;font-weight:700;font-size:12.5px;color:var(--gold2)}
#start h1{margin:0;font-size:42px;line-height:1.02}
#start p{margin:0;font-size:15.5px;line-height:1.4}
#start>.card{gap:10px}
#start .about{font-size:15.5px;line-height:1.45}
.evt{display:grid;gap:1px;font-size:13.5px;line-height:1.4;opacity:.8}
#name.shake{animation:shake .45s 1}
#langs{display:flex;justify-content:center;gap:6px}
#langs button{font:700 13px "Figtree",sans-serif;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--cream);padding:5px 13px;cursor:pointer}
#langs button.on{background:var(--gold2);color:var(--ink);border-color:#fff3c4}
#more{text-align:left;display:grid;gap:6px;font-size:14.5px;line-height:1.4}
#more div{background:rgba(0,0,0,.16);border-radius:10px;padding:8px 12px}

/* ticket screen */
#win>.card{gap:10px}
#win h2{margin:0;font-size:34px;line-height:1.05}
#score{font-size:15px;font-weight:600}
#score b{color:var(--gold2)}
#claim{background:rgba(0,0,0,.2);border-radius:16px;padding:14px 14px 13px;display:grid;gap:8px;justify-items:center}
#claim .gift{position:relative;line-height:1}
#claim .gift .g{display:inline-block;font-size:52px;transform-origin:50% 90%;animation:wob 3.2s ease-in-out infinite;filter:drop-shadow(0 5px 7px rgba(0,0,0,.3))}
#claim .gift .tag{position:absolute;left:70%;top:6%;white-space:nowrap;background:var(--cream);color:var(--ink);font:400 14.5px "Marcellus",Georgia,serif;padding:3px 9px;border-radius:8px 8px 8px 0;transform:rotate(-6deg);box-shadow:0 2px 6px rgba(0,0,0,.3);max-width:34vw;overflow:hidden;text-overflow:ellipsis}
#claim .ch{font-size:27px;line-height:1.1;color:var(--gold2)}
#claim .inv{font-size:15px;line-height:1.35}
#claim .sem{font-size:21px;line-height:1.15;color:var(--cream)}
#claim .when{font-size:14px;font-weight:700;line-height:1.4;color:var(--gold2)}
#claim .warm{font-size:14px;line-height:1.4;opacity:.95}
#claim .already{font-size:13.5px;line-height:1.35;opacity:.9}
#signup{width:100%;margin-top:3px}
.btn.love{font-size:16.5px;padding:12px 14px;border:2px solid var(--gold2);background:rgba(255,255,255,.1)}
.btn.love.glow{background:linear-gradient(#ffe9a0,#f2c04a);color:var(--ink);border-color:#fff3c4}

#name{font:600 16px "Figtree",sans-serif;padding:10px 12px;border-radius:10px;border:2px solid var(--gold2);background:rgba(255,255,255,.16);color:var(--cream);text-align:center;-webkit-user-select:text;user-select:text}
#name::placeholder{color:rgba(255,246,226,.65)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nameMsg{font-size:14px;font-weight:700;color:var(--gold2);min-height:1.2em;margin-top:-6px}
.board{background:rgba(0,0,0,.2);border-radius:12px;padding:8px 10px;text-align:left;font-size:15px}
.board ol{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.board li{display:grid;grid-template-columns:2.2em 1fr auto;gap:6px;align-items:center;padding:4px 6px;border-radius:8px}

.board li.m2{background:rgba(226,230,238,.24)}
.board li.m3{background:rgba(214,134,62,.30)}
.board li.m1 .r,.board li.m2 .r,.board li.m3 .r{font-size:19px;line-height:1}
.board li.me{background:var(--gold2);color:var(--ink)}

.board .you{text-align:center;font-weight:800;color:var(--gold2);padding:2px 0 6px;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 18px;font-weight:700;display:none;z-index:9;max-width:86vw;text-align:center;pointer-events:none}
</style>

  if(Math.hypot(x,z)<TREE_R+1.4)continue;if(Math.hypot(x-player.pos.x,z-player.pos.z)<3)continue;if(spots.some(s=>Math.hypot(s[0]-x,s[1]-z)<gap))continue;spots.push([x,z]);}
 spots.forEach((s,i)=>dropOne(pool[i],s[0],s[1],T+i*.07));}
function dropOne(p,x,z,t0){p.x=x;p.z=z;p.y=DROP_H;p.t0=t0;p.state='fall';p.g.visible=true;p.g.scale.setScalar(1);p.ch.visible=true;p.ch.scale.setScalar(1);p.box.userData.lid.position.y=giftGeo(.95).bh;p.box.userData.lid.rotation.set(0,0,0);
 p.ring.visible=p.dot.visible=true;p.ring.position.x=p.dot.position.x=p.x;p.ring.position.z=p.dot.position.z=p.z;}

function catchGift(p){p.state='pop';p.t0=T;const n=nCatch%GOAL;nCatch++;caught+=p.gold?3:1;cheer=1;
 chime([PENTA[n%PENTA.length],PENTA[n%PENTA.length]+7],.2,.07);burst(V(p.x,p.y+.8,p.z),18,4.5);
 placed[n].t0=T;placed[n].from.set(p.x,p.y+.5,p.z);
 $('#count').textContent=`🎁 ${caught}`;
 if(p.gold)tip('+3',tr().gold,1500);else if(nCatch%5===0)tip('',tr().teasers[(nCatch/5|0)%GOAL]);}

function win(){state='won';winT=T;tEnd=performance.now()/1000;const secs=caught;
 const prev=parseFloat(store.get('rushbest')||'0');const nb=secs>prev;if(nb)store.set('rushbest',String(secs));win.nb=nb;win.secs=secs;win.best=nb?secs:prev;
 tip('',tr().timeUp,2800);pool.forEach(p=>{if(p.state==='fall'||p.state==='ground'){p.state='leave';p.t0=T;}});
 setTimeout(()=>chime([72,76,79,84,88,91,96],.2,.11),900);setTimeout(()=>{burst(V(0,8.8,0),160,9);whoosh();},1000);
 postScore();
 setTimeout(()=>{if(state!=='won')return;$('#joy').classList.remove('show');gotT=false;againWarn=false;showScore();fillTicket();$('#win').hidden=false;$('#win').scrollTop=0;},3600);}
function showScore(){$('#score').innerHTML=tr().score(win.secs,win.best,win.nb);}

/* ================= ticket screen ================= */
$('#name').value=store.get('name')||'';
function fillTicket(){const D=tr(),nm=$('#name').value.trim();$('#winH').textContent=D.winHn(nm);$('#giftTag').textContent=D.tag(nm);
 $('#claim').classList.toggle('done',gotT);$('#share').classList.toggle('glow',gotT);}
$('#name').addEventListener('input',()=>{store.set('name',$('#name').value.trim());fillTicket();updatePlay();});
$('#name').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();startGame();}});
function openURL(u){const w=window.open(u,'_blank','noopener');if(!w)location.href=u;}
$('#dir').onclick=()=>openURL(EVENT.maps);
$('#signup').onclick=()=>{gotT=true;fillTicket();openURL(EVENT.signup[lang]||EVENT.signup.en);};
$('#share').onclick=async()=>{const D=tr(),url=EVENT.game,msg=D.shareText(win.secs);
 if(navigator.share){try{await navigator.share({title:D.title,text:msg,url});return;}catch(e){if(e&&e.name==='AbortError')return;}}
 try{await navigator.clipboard.writeText(msg+' '+url);toast(D.copied);}catch(e){prompt('',msg+' '+url);}};

/* ================= Top 10 board ================= */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let posted=false,posting=false,lastBoard=null,myRank=0;
/* one random id per phone; the board shows each name on a phone once (its best time) */
const PID=(()=>{let p=store.get('pid');if(!p||!/^[A-Za-z0-9]{8,40}$/.test(p)){p=Math.random().toString(36).slice(2,12)+Date.now().toString(36);store.set('pid',p);}return p;})();
/* name filter: same lists as the score script (keep both in sync) */
const BAD_PART=['fuck','fuk','fck','fvck','phuck','shit','bitch','biatch','cunt','pussy','dick','cock','whore','slut','nigga','nigger','faggot','asshole','dumbass','jackass','bastard','damn','porn','penis','vagina','dildo','horny','retard','idiot','stupid','hitler','puta','puto','pendej','verga','chinga','mierda','culero','cabron','pinche','joto','mamon','estupid','imbecil'];
const BAD_WORD=['ass','hell','tit','tits','cum','sex','fag','rape','nig','wtf','stfu','cono','pito','pene','caca','poop','butt','crap','loser','dumb','piss','boob','boobs','perra','zorra','marica','nazi','kkk','sht','culo'];
const normN=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/7/g,'t').replace(/8/g,'b');
const squashN=s=>s.replace(/[^a-z]/g,'').replace(/(.)\1+/g,'$1'),trim3N=s=>s.replace(/(.)\1{2,}/g,'$1$1');
function isBadName(raw){const n=normN(raw),all=squashN(n);if(BAD_PART.some(w=>all.includes(squashN(w))))return true;
 const words=n.split(/[^a-z]+/).filter(Boolean).map(trim3N);words.push(trim3N(n.replace(/[^a-z]/g,'')));return BAD_WORD.some(w=>words.includes(trim3N(w)));}
function nameState(){const v=$('#name').value.trim(),letters=v.replace(/[^\p{L}]/gu,'').length;if(isBadName(v))return'bad';if(/[^\p{L}\p{M} .'\-]/u.test(v))return'chars';if(letters<2)return'short';return'ok';}
function updatePlay(){const s=nameState(),D=tr();$('#play').disabled=!ready;$('#nameMsg').textContent=s==='bad'?D.badName:s==='chars'?D.lettersOnly:(s==='short'&&$('#name').value.trim()?D.needName:'');}
/* the board keeps one line per name on each phone (two people can share a phone); light up only the name typed now */
const isMine=n=>{const v=$('#name').value.replace(/\s+/g,' ').trim().toLowerCase();return !v||String(n).toLowerCase()===v;};
function drawBoard(el,data){const D=tr();el.hidden=false;
 if(data==='loading'){el.innerHTML=`<div class="msg">${el.id==='boardWin'?D.posting:D.boardLoading}</div>`;return;}
 if(!data){el.innerHTML=`<div class="msg">${D.boardErr}</div>`;return;}
 const you=(el.id==='boardWin'&&myRank)?`<div class="you">${D.rankMsg(myRank)}</div>`:'';
 if(!data.top.length){el.innerHTML=you+`<div class="msg">${D.boardEmpty}</div>`;return;}
 el.innerHTML=you+'<ol>'+data.top.map((e,i)=>`<li class="${i<3?'m'+(i+1):''}${e.me&&isMine(e.n)?' me':''}"><span class="r">${['🥇','🥈','🥉'][i]||i+1}</span><span>${esc(e.n)}</span><span class="t">${e.t} 🎁</span></li>`).join('')+'</ol>';}
async function loadBoard(el){drawBoard(el,'loading');
 try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);const r=await fetch(BOARD_URL+'?board=rush&pid='+encodeURIComponent(PID),{signal:ctl.signal});clearTimeout(to);const j=await r.json();if(!j.ok)throw 0;lastBoard=j;drawBoard(el,j);}
 catch(e){drawBoard(el,null);}}
$('#topBtn').onclick=()=>{const el=$('#boardStart');if(!el.hidden){el.hidden=true;return;}loadBoard(el);};
/* the finish screen posts the time by itself; the button only shows if that fails */
let runTok='',runN=0;
/* the score board hands out a signed pass when Play is tapped; a time without one is refused */
function getPass(tries=2){const my=++runN;runTok='';const go=n=>fetch(BOARD_URL,{method:'POST',body:JSON.stringify({start:1,pid:PID})}).then(r=>r.json()).then(j=>{if(my===runN&&j.ok&&j.tok)runTok=j.tok;else if(my===runN&&n>1)setTimeout(()=>go(n-1),2500);}).catch(()=>{if(my===runN&&n>1)setTimeout(()=>go(n-1),2500);});go(tries);}
async function postScore(){const D=tr(),nm=$('#name').value.trim(),b=$('#post');if(posted||posting)return;if(!runTok||win.secs<1){posted=true;b.hidden=true;loadBoard($('#boardWin'));return;}posting=true;b.hidden=true;drawBoard($('#boardWin'),'loading');
 try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  const r=await fetch(BOARD_URL,{method:'POST',body:JSON.stringify({board:'rush',name:nm,score:win.secs,lang,pid:PID,tok:runTok}),signal:ctl.signal});clearTimeout(to);const j=await r.json();
  if(!j.ok){if(j.why==='time'||j.why==='name'){$('#boardWin').innerHTML=`<div class="msg">${j.why==='name'?D.badName:D.badTime}</div>`;posted=true;}else{drawBoard($('#boardWin'),null);b.hidden=false;}return;}
  posted=true;myRank=j.rank;lastBoard=j;drawBoard($('#boardWin'),j);chime([79,84,88],.16);}
 catch(e){drawBoard($('#boardWin'),null);b.hidden=false;}
 finally{posting=false;}}
$('#post').onclick=postScore;

/* ================= main loop ================= */
let ready=false,last=performance.now();
const camPos=V(0,12,24),camTgt=V(0,1,6),tmpV=V();
function frame(){requestAnimationFrame(frame);const now=performance.now(),dt=clamp((now-last)/1000,0,.05);last=now;T+=dt;step(dt);composer.render();}
function step(dt){
 // move
 let ix=0,iy=0;if(state==='play'){if(keys.has('a')||keys.has('arrowleft'))ix-=1;if(keys.has('d')||keys.has('arrowright'))ix+=1;if(keys.has('w')||keys.has('arrowup'))iy+=1;if(keys.has('s')||keys.has('arrowdown'))iy-=1;ix+=joyV.x;iy+=joyV.y;}
 const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;}
 const want=V(ix*SPEED,0,-iy*SPEED);player.vel.lerp(want,1-Math.exp(-dt*12));player.pos.addScaledVector(player.vel,dt);
 const d=Math.hypot(player.pos.x,player.pos.z);if(d>R_PLAY+1){player.pos.x*=(R_PLAY+1)/d;player.pos.z*=(R_PLAY+1)/d;}
 if(d<TREE_R&&d>1e-4){player.pos.x*=TREE_R/d;player.pos.z*=TREE_R/d;}
 const sp=player.vel.length();if(sp>.3){const ty=Math.atan2(player.vel.x,player.vel.z);let dy=ty-player.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));player.yaw+=dy*(1-Math.exp(-dt*14));}
 player.walk+=dt*sp*1.9;const sw=Math.sin(player.walk)*Math.min(1,sp/3);const P=player.p;
 P.g.position.copy(player.pos);P.g.rotation.y=player.yaw;P.legL.rotation.x=sw*.75;P.legR.rotation.x=-sw*.75;
 if(state==='won'){const u=T-winT,j=Math.abs(Math.sin(u*7))*(u<3?1:0);P.g.position.y=j*.35;P.armL.rotation.x=P.armR.rotation.x=-2.7*sm(clamp(u*3));}
 else{P.armL.rotation.x=-sw*.6;P.armR.rotation.x=sw*.6;P.g.position.y=Math.abs(Math.sin(player.walk))*.05*Math.min(1,sp/3);}
 if(state==='play'){const rem=ROUND-(performance.now()/1000-tStart);$('#clock').textContent='⏱ '+Math.max(0,rem).toFixed(1);if(rem<=0)win();else spawnTick();}
 // gifts
 let nearest=null,nd=1e9;
 for(const p of pool){if(p.state==='off')continue;const u=T-p.t0;
  if(p.state==='fall'){const k=clamp(u/FALL);p.y=DROP_H*(1-k);const sway=Math.sin(u*2.1+p.ph)*.35*(1-k);p.g.position.set(p.x+sway,p.y,p.z+Math.cos(u*1.7+p.ph)*.2*(1-k));p.g.rotation.y=u*.5+p.ph;p.g.rotation.z=Math.sin(u*1.8+p.ph)*.12*(1-k);
   p.ring.material.opacity=.35+.6*k;p.dot.material.opacity=.08+.25*k;const rs=1.25-.35*k;p.ring.scale.setScalar(rs+.05*Math.sin(T*6));p.dot.scale.setScalar(rs);
   if(k>=1){p.state='ground';p.t0=T;p.g.rotation.z=0;}}
  else if(p.state==='ground'){p.g.position.set(p.x,0,p.z);const cs=1-clamp(u/.35);p.ch.visible=cs>.02;if(cs>.02)p.ch.scale.setScalar(cs);p.box.scale.y=1-.2*Math.exp(-u*8)*Math.cos(u*26);
   p.ring.material.opacity=.95;p.dot.material.opacity=.3;p.ring.scale.setScalar(.95+.05*Math.sin(T*6+p.ph));}
  else if(p.state==='leave'){const k=clamp(u/.6);p.g.scale.setScalar(1-eoc(k));p.g.position.y+=dt*3;p.ring.material.opacity*=.85;p.dot.material.opacity*=.85;if(k>=1){p.state='off';p.g.visible=p.ring.visible=p.dot.visible=false;}}
  else if(p.state==='pop'){const k=clamp(u/.45),lid=p.box.userData.lid;lid.position.y=giftGeo(.95).bh+eoc(k)*1.2;lid.rotation.z=k*1.2;p.ch.visible=false;p.g.scale.setScalar(1+.25*Math.sin(Math.PI*k));p.ring.material.opacity*=.8;p.dot.material.opacity*=.8;
   if(k>=1){p.state='off';p.g.visible=p.ring.visible=p.dot.visible=false;}}
  if(state==='play'&&(p.state==='fall'||p.state==='ground')){const dd=Math.hypot(player.pos.x-p.x,player.pos.z-p.z);if(dd<1.35&&p.y<2.3){catchGift(p);continue;}if(dd<nd){nd=dd;nearest=p;}}}
 // gifts flying to the tree
 for(let i=0;i<placed.length;i++){const q=placed[i];if(q.t0<0)continue;const k=clamp((T-q.t0)/.8);q.g.visible=true;const to=SLOTS[i];
  q.g.position.set(mix(q.from.x,to.x,sm(k)),mix(q.from.y,.45,k)+Math.sin(Math.PI*k)*3,mix(q.from.z,to.z,sm(k)));q.g.scale.setScalar(k<1?.8+.2*k:1+.12*Math.exp(-(T-q.t0-.8)*7)*Math.sin((T-q.t0-.8)*30));
  if(k>=1&&!q.chimed){q.chimed=true;}if(k<1)q.chimed=false;}
 // arrow to nearest present (only when it is a few steps away)
 if(false){arrow.visible=true;const a=Math.atan2(nearest.x-player.pos.x,nearest.z-player.pos.z);arrow.position.set(player.pos.x+Math.sin(a)*1.25,.07,player.pos.z+Math.cos(a)*1.25);arrow.rotation.y=a+Math.PI;arrow.material.opacity=.7+.3*Math.sin(T*8);}else arrow.visible=false;
 // tree + star
 const lit=state==='menu'?.35:Math.min(1,caught/FULL_TREE);setLights(tree,lit,T);setStar(tree,state==='won'?clamp((T-winT-.9)/1.2):0,T);
 if(state==='won'){const k=clamp((T-winT-1.4)/1.5);venueDoors.forEach(m=>m.emissiveIntensity=1.6*k);}
 // townspeople
 cheer=Math.max(0,cheer-dt*.9);const ch=state==='won'?1:cheer;anims.forEach(f=>f(T,ch));
 updConf(dt);
 // camera
 if(tipTimer>0){tipTimer-=dt;if(tipTimer<=0)$('#tip').classList.remove('on');}
 let cp,ct;
 if(state==='menu'){const a=T*.07;cp=V(Math.sin(a)*30,15,Math.cos(a)*30);ct=V(0,4.5,0);}
 else if(state==='won'&&T-winT>.6){const k=sm(clamp((T-winT-.6)/2));cp=V(mix(player.pos.x*.85,0,k),mix(portrait?10.5:8.5,7,k),mix(player.pos.z+(portrait?14:13.5),17,k));ct=V(0,mix(2,5.5,k),mix(player.pos.z-3,0,k));}
 else{cp=V(player.pos.x*.85,portrait?10.5:8.5,player.pos.z+(portrait?14:13.5));ct=V(player.pos.x*.92,2,player.pos.z-3);}
 const kk=1-Math.exp(-dt*(state==='menu'?2:6));camPos.lerp(cp,kk);camTgt.lerp(ct,kk);camera.position.copy(camPos);camera.lookAt(camTgt);
 key.position.copy(player.pos).addScaledVector(SUN,60);key.target.position.copy(player.pos);
}

/* ================= boot ================= */
resize();makeSharedTex();buildTown();setupActors();applyLang();
requestAnimationFrame(frame);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ready=true;applyLang();updatePlay();});
setTimeout(()=>{if(!ready){ready=true;applyLang();updatePlay();}},2500);
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))window.__game={tick(s){const n=Math.round(s/.033);for(let i=0;i<n;i++){T+=.033;step(.033);}last=performance.now();composer.render();return T;},get state(){return state;},get caught(){return caught;},start:startGame,dbg(){return{T,nextSpawn,player:[player.pos.x,player.pos.z],pool:pool.map(p=>[p.state,+p.x.toFixed(1),+p.z.toFixed(1),+p.y.toFixed(1)])};},
 /* test hook: catch the next present right away */ grab(){const p=pool.find(q=>q.state==='fall'||q.state==='ground');if(p){player.pos.set(p.x,0,p.z);player.vel.set(0,0,0);if(p.state==='fall')p.t0=Math.min(p.t0,T-FALL*.9);}},
 winNow(){tStart-=ROUND;}};
</script>
